name: Build

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Lapis.slnx

      - name: Build
        run: dotnet build Lapis.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Lapis.slnx --configuration Release --no-build

  # On milestone branches, also build the macOS packages so they can be downloaded from the run and tried on a Mac.
  macos-packages:
    if: startsWith(github.ref, 'refs/heads/milestone/')
    uses: ./.github/workflows/macos-packages.yml
