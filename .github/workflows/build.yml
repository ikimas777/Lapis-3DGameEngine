name: Build

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Lapis.slnx

      - name: Build
        run: dotnet build Lapis.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Lapis.slnx --configuration Release --no-build
