name: Release

# Pushing a version tag (for example v0.7.0, v0.7.0-beta.1 or v0.7.0-alpha.2) builds the editor for Windows,
# Linux and macOS (Apple Silicon and Intel) and publishes the packages on the repository's Releases page. The
# version inside the programs comes from the tag, so it always matches the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        shell: pwsh
        run: ./scripts/publish-editor.ps1 -Output publish/Lapis -Version ("${{ github.ref_name }}".TrimStart("v"))

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/Lapis -DestinationPath Lapis-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Lapis-Windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: LAPIS_VERSION="${GITHUB_REF_NAME#v}" ./scripts/publish-editor.sh publish/Lapis

      - name: Package
        # tar keeps the executable permissions.
        run: tar -czf Lapis-Linux-x64.tar.gz -C publish Lapis

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Lapis-Linux-x64.tar.gz

  macos:
    uses: ./.github/workflows/macos-packages.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Tags such as v0.7.0-alpha.1 or v0.7.0-beta.2 become pre-releases, so only stable versions are "Latest".
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" Lapis-Windows-x64.zip Lapis-Linux-x64.tar.gz Lapis-macOS-arm64.zip Lapis-macOS-x64.zip \
            --repo "${{ github.repository }}" \
            --title "Lapis $TAG" \
            --generate-notes $prerelease
